<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Savings versus under-routing on the tune set">
<style>
  :root { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --grid:#383835; --s1:#3987e5; --s2:#d95926; } }
  .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--ink2);stroke-width:1}
  .tick{fill:var(--ink2);font:11px system-ui,sans-serif} .lbl{fill:var(--ink);font:12px system-ui,sans-serif}
  .title{fill:var(--ink);font:600 14px system-ui,sans-serif} .jevline{fill:none;stroke:var(--s1);stroke-width:2}
  .jev{fill:var(--s1);stroke:var(--bg);stroke-width:2} .ring{fill:none;stroke:var(--s1);stroke-width:2}
  .base{fill:var(--s2);stroke:var(--bg);stroke-width:2}
</style>
<rect class="bg" width="640" height="380" rx="6"/>
<text class="title" x="56" y="22">Savings vs under-routing (TUNE set)</text>
<g transform="translate(418,12)"><circle class="jev" cx="6" cy="6" r="4"/><text class="lbl" x="16" y="10">Jev settings (Pareto)</text><circle class="base" cx="136" cy="6" r="5"/><text class="lbl" x="146" y="10">Baselines</text></g>
<line class="grid" x1="56" x2="608" y1="332" y2="332"/><text class="tick" x="48" y="336" text-anchor="end">0%</text><line class="grid" x1="56" x2="608" y1="273.6" y2="273.6"/><text class="tick" x="48" y="277.6" text-anchor="end">10%</text><line class="grid" x1="56" x2="608" y1="215.2" y2="215.2"/><text class="tick" x="48" y="219.2" text-anchor="end">20%</text><line class="grid" x1="56" x2="608" y1="156.79999999999998" y2="156.79999999999998"/><text class="tick" x="48" y="160.79999999999998" text-anchor="end">30%</text><line class="grid" x1="56" x2="608" y1="98.39999999999998" y2="98.39999999999998"/><text class="tick" x="48" y="102.39999999999998" text-anchor="end">40%</text><line class="grid" x1="56" x2="608" y1="40" y2="40"/><text class="tick" x="48" y="44" text-anchor="end">50%</text><text class="tick" x="56" y="350" text-anchor="middle">0</text><text class="tick" x="166.4" y="350" text-anchor="middle">0.5</text><text class="tick" x="276.8" y="350" text-anchor="middle">1</text><text class="tick" x="387.2" y="350" text-anchor="middle">1.5</text><text class="tick" x="497.6" y="350" text-anchor="middle">2</text><text class="tick" x="608" y="350" text-anchor="middle">2.5</text>
<line class="axis" x1="56" x2="608" y1="332" y2="332"/>
<text class="tick" x="332" y="370" text-anchor="middle">mean tier rank (lower = cheaper)</text>
<text class="tick" transform="translate(14,186) rotate(-90)" text-anchor="middle">under-routing rate</text>
<path class="jevline" d="M188.5,215.2 L365.1,332.0"/><circle class="jev" cx="188.48" cy="215.2" r="4"><title>Jev setting: spend 0.600, under-routing 20.0%</title></circle><circle class="jev" cx="365.11999999999995" cy="332" r="4"><title>Jev setting: spend 1.400, under-routing 0.0%</title></circle><circle class="ring" cx="365.11999999999995" cy="332" r="8"><title>Jev chosen: spend 1.400, under-routing 0.0%</title></circle><text class="lbl" x="374.11999999999995" y="310" text-anchor="start">Jev (chosen)</text><circle class="base" cx="100.16" cy="98.39999999999998" r="5"><title>length: spend 0.200, under-routing 40.0%</title></circle><text class="lbl" x="109.16" y="90.39999999999998" text-anchor="start">length</text><circle class="base" cx="320.96" cy="332" r="5"><title>keywords: spend 1.200, under-routing 0.0%</title></circle><text class="lbl" x="329.96" y="324" text-anchor="start">keywords</text><circle class="base" cx="276.8" cy="98.39999999999998" r="5"><title>always_standard: spend 1.000, under-routing 40.0%</title></circle><text class="lbl" x="285.8" y="90.39999999999998" text-anchor="start">always_standard</text><circle class="base" cx="497.6" cy="332" r="5"><title>always_frontier: spend 2.000, under-routing 0.0%</title></circle><text class="lbl" x="506.6" y="324" text-anchor="start">always_frontier</text>
</svg>
